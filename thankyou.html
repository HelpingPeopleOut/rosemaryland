<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Thank You | RoseMaryLand</title>
    
    <link rel="icon" type="image/jpeg" href="https://images.squarespace-cdn.com/content/v1/660b3da749af8d6bcb3556bf/880aefe6-06b1-4d27-a63f-83de3c9236fc/Rose+Maryland+Logo.jpg?format=1000w">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#D1C4E9">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RoseMaryLand">
    <link rel="apple-touch-icon" href="https://images.squarespace-cdn.com/content/v1/660b3da749af8d6bcb3556bf/880aefe6-06b1-4d27-a63f-83de3c9236fc/Rose+Maryland+Logo.jpg?format=1000w">

    <style>
        /* Modern App-Style Variables (Lavender Theme) */
        :root {
            --primary: #2c3e1e;
            --primary-hover: #1f2c15;
            --accent: #D1C4E9;
            --bg-base: #FDFBFC;
            --bg-surface: #FFFFFF;
            --text-main: #1A1A1A;
            --text-muted: #666666;
            --radius-lg: 32px;
            --radius-sm: 12px;
            --shadow-soft: 0 16px 40px rgba(0, 0, 0, 0.04);
            --font-display: 'Georgia', serif;
            --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-base);
            color: var(--text-main);
            line-height: 1.6;
            overflow-x: hidden;
            padding-bottom: 80px;
            position: relative;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: 
                radial-gradient(circle at 15% 50%, rgba(209, 196, 233, 0.35), transparent 50%),
                radial-gradient(circle at 85% 30%, rgba(209, 196, 233, 0.25), transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        a { text-decoration: none; color: inherit; }

        .top-bar {
            position: sticky; top: 0; z-index: 1000;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(209, 196, 233, 0.4);
            padding: 1rem 5%;
            display: flex; justify-content: space-between; align-items: center;
        }

        .logo {
            font-family: var(--font-display); font-size: 1.5rem; font-weight: bold;
            color: var(--primary); display: flex; align-items: center; gap: 12px;
        }

        .logo img {
            height: 40px; width: 40px; border-radius: 50%; object-fit: cover;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .desktop-nav { display: flex; gap: 2rem; align-items: center; }
        .desktop-nav a { font-weight: 500; color: var(--text-muted); transition: var(--transition); position: relative; }
        .desktop-nav a::after { content: ''; position: absolute; width: 0; height: 2px; bottom: -4px; left: 0; background-color: var(--primary); transition: var(--transition); }
        .desktop-nav a:hover, .desktop-nav a.active { color: var(--primary); }
        .desktop-nav a:hover::after, .desktop-nav a.active::after { width: 100%; }

        .btn {
            background-color: var(--primary); color: #fff; padding: 0.8rem 2rem;
            border-radius: 100px; font-weight: 600; font-size: 1rem; border: none; cursor: pointer;
            transition: var(--transition); display: inline-flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn:hover { background-color: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(44, 62, 30, 0.2); }

        main { flex-grow: 1; display: flex; justify-content: center; align-items: center; padding: 2rem 5%; }

        .thank-you-card {
            background-color: #fff;
            border-radius: var(--radius-lg);
            padding: 4rem 2rem;
            box-shadow: 0 20px 60px rgba(209, 196, 233, 0.3);
            max-width: 600px;
            width: 100%;
            text-align: center;
            border-top: 6px solid var(--accent);
        }

        .thank-you-card h1 {
            font-family: var(--font-display);
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .thank-you-card p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }

        .emoji-icon { font-size: 4rem; display: block; margin-bottom: 1rem; }

        .bottom-nav {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(209, 196, 233, 0.4);
            padding: 0.8rem 1rem calc(0.8rem + env(safe-area-inset-bottom));
            z-index: 2000; justify-content: space-around; box-shadow: 0 -10px 30px rgba(209, 196, 233, 0.15);
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 500; color: var(--text-muted); }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 1.2rem; }

        @media (max-width: 768px) {
            .desktop-nav, .top-bar .btn { display: none; }
            .bottom-nav { display: flex; }
        }
    </style>
</head>
<body>

    <header class="top-bar">
        <a href="index.html" class="logo">
            <img src="https://images.squarespace-cdn.com/content/v1/660b3da749af8d6bcb3556bf/880aefe6-06b1-4d27-a63f-83de3c9236fc/Rose+Maryland+Logo.jpg?format=1000w" alt="RoseMaryLand Logo">
            RoseMaryLand
        </a>
        <nav class="desktop-nav">
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="appointments.html">Haircare</a>
            <a href="about.html">About</a>
        </nav>
    </header>

    <main>
        <div class="thank-you-card">
            <span class="emoji-icon">✨</span>
            <h1>Thank You!</h1>
            <p>We have received your request. Our team will review your details and be in touch with you shortly.</p>
            <a href="index.html" class="btn">Return to Home</a>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">⌂</span>
            <span>Home</span>
        </a>
        <a href="shop.html" class="nav-item">
            <span class="nav-icon">🛍️</span>
            <span>Shop</span>
        </a>
        <a href="appointments.html" class="nav-item">
            <span class="nav-icon">📅</span>
            <span>Book</span>
        </a>
        <a href="about.html" class="nav-item">
            <span class="nav-icon">✨</span>
            <span>About</span>
        </a>
    </nav>

</body>
</html>
